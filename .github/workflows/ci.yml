name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Install deps
        working-directory: app
        run: npm install --legacy-peer-deps
      - name: Generate types
        working-directory: app
        run: npm run generate:types || true
      - name: Build
        working-directory: app
        env:
          DATABASE_ADAPTER: sqlite
          DATABASE_URI: file:./vtngason.db
          PAYLOAD_SECRET: ci-secret-for-build-only-please-change-in-prod
          NEXT_PUBLIC_SITE_URL: https://vienthongngason.com
        run: |
          mkdir -p ../content
          SEED_ADMIN_PASSWORD=$(node -e "console.log(require('crypto').randomBytes(24).toString('hex'))") npx -y tsx src/seed.ts || true
          npm run build

  docker:
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - name: Check docker-compose syntax
        working-directory: app
        run: docker compose config --quiet && echo "compose ok"
